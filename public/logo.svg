<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary rich blue gradient for the main R / document body -->
    <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue 500 -->
      <stop offset="40%" stop-color="#1d4ed8" /> <!-- Blue 700 -->
      <stop offset="100%" stop-color="#1e3a8a" /> <!-- Blue 900 -->
    </linearGradient>

    <!-- Glowing sky blue gradient for the validation checkmark -->
    <linearGradient id="gradCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" /> <!-- Sky 600 -->
      <stop offset="100%" stop-color="#38bdf8" /> <!-- Sky 400 -->
    </linearGradient>

    <!-- Subtle document shading -->
    <linearGradient id="gradDocLines" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Group for Logo Icon -->
  <g id="logo-icon">
    <!-- Main Stylized Document and Letter R Shape -->
    <!-- Represents the blended document (left) and loop/foot of R (right) -->
    <path d="M 190,135 
             L 245,135 
             A 10,10 0 0,1 255,145 
             L 255,170 
             C 255,170 295,170 315,170 
             C 365,170 410,195 410,245 
             C 410,295 365,315 315,315 
             L 255,315 
             L 255,317 
             C 285,347 345,410 375,442 
             C 385,452 375,462 360,462 
             C 345,462 320,432 295,405 
             L 255,360 
             L 255,445 
             A 15,15 0 0,1 240,460 
             L 165,460 
             A 45,45 0 0,1 120,415 
             L 120,185 
             Z" 
          fill="url(#gradR)" />

    <!-- Corner Page Fold (Dog ear inside the top-left curve) -->
    <!-- Folds from 120,185 up to the main alignment -->
    <path d="M 120,185 Z" fill="#ffffff" opacity="0.15" />
    <path d="M 120,185 
             L 165,135 
             L 190,135 
             C 190,135 165,170 165,185 
             C 165,195 155,200 145,200 
             L 120,185 
             Z" 
          fill="#ffffff" />

    <!-- Inner Document Details -->
    <!-- 1. Profile Avatar (Silhouette head and shoulders) -->
    <circle cx="190" cy="245" r="18" fill="#ffffff" />
    <path d="M 165,290 
             C 165,275 175,270 190,270 
             C 205,270 215,275 215,290 
             Z" 
          fill="#ffffff" />

    <!-- 2. Text layout placeholders inside the resume -->
    <!-- Header title line (Active Blue/White) -->
    <rect x="145" y="310" width="85" height="8" rx="4" fill="#38bdf8" />
    
    <!-- Row 1 details (bullet and line) -->
    <rect x="145" y="335" width="85" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />
    
    <!-- Row 2 details (bullet and line) -->
    <circle cx="150" cy="358" r="4" fill="#cbd5e1" opacity="0.7" />
    <rect x="162" y="355" width="68" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />

    <!-- Row 3 details (bullet and line) -->
    <circle cx="150" cy="378" r="4" fill="#cbd5e1" opacity="0.7" />
    <rect x="162" y="375" width="68" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />

    <!-- Row 4 details (bullet and line) -->
    <circle cx="150" cy="398" r="4" fill="#cbd5e1" opacity="0.7" />
    <rect x="162" y="395" width="55" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />

    <!-- Overlapping Validation Checkmark on the bottom right -->
    <!-- Perfectly aligns with the custom stylized R loop baseline -->
    <path d="M 235,395 
             L 275,355 
             A 10,10 0 0,1 289,355 
             L 315,385 
             L 410,275 
             A 10,10 0 0,1 424,275 
             L 435,286 
             A 10,10 0 0,1 435,300 
             L 322,430 
             A 10,10 0 0,1 308,430 
             L 246,410 
             A 10,10 0 0,1 235,395 
             Z" 
          fill="url(#gradCheck)" 
          filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))" />
  </g>
</svg>
